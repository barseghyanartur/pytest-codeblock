[tox]
requires =
    tox-uv>=1
envlist =
    py{310,311,312,313,314}-pytest90
    py{310,311,312,313,314}-pytest91

[testenv]
runner = uv-venv-runner
passenv = *
allowlist_externals = *
deps =
    pytest-cov
    tomli; python_version < "3.11"
    django
    moto[s3]
    # openai v3's client isn't intercepted by the respx-based mocking in conftest.py
    openai<3
    pytest-django
    respx
    langchain-tests
    detect-secrets
    doc8
    pytest: pytest>=9.0.0,<9.1.0
    pytest91: pytest>=9.1.0,<9.2.0
commands =
    uv pip install -e .
    pytest -vrx {posargs}

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
